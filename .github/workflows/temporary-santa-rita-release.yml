name: Temporary pinned Santa Rita release
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RELEASE_SANTA_RITA_PINNED"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: santa-rita-pinned-release
  cancel-in-progress: false
jobs:
  release:
    if: inputs.confirm == 'RELEASE_SANTA_RITA_PINNED'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: 591ddd04dc8a8556969957d263a71d0d435fb836
      CLOUDFLARE_ACCOUNT_ID: 257bca437616da74ece1ce4bbaf0bd89
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SOURCE_READ_TOKEN: ${{ secrets.TEMP_PRIVATE_READ_TOKEN }}
    steps:
      - name: Require existing secrets without revealing them
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Donor Cloudflare secret missing"; exit 1; }
          test -n "$SOURCE_READ_TOKEN" || { echo "Private source access secret missing"; exit 1; }
      - name: Download exact approved commit from private Santa Rita
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/menezesx2k26-byte/web-santa-rita-excursoes"
          curl -fLsS --max-time 40 -H "Authorization: Bearer $SOURCE_READ_TOKEN" "$api/commits/$TARGET_SHA" -o "$RUNNER_TEMP/commit.json"
          jq -e --arg sha "$TARGET_SHA" '.sha==$sha' "$RUNNER_TEMP/commit.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/santa-source"
          curl -fLsS --max-time 120 -H "Authorization: Bearer $SOURCE_READ_TOKEN" "$api/tarball/$TARGET_SHA" |
            tar -xz --strip-components=1 -C "$RUNNER_TEMP/santa-source"
          grep -Fq 'excursoes-santa-rita' "$RUNNER_TEMP/santa-source/wrangler.jsonc"
      - name: Verify tests and build exact Santa Rita source
        working-directory: ${{ runner.temp }}/santa-source
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run test:integration
          npm run build
          grep -Fq 'departure-card__status' dist/client/admin/admin.js
          test -f dist/server/wrangler.json
      # D1 read independently confirmed on connected Cloudflare account:
      # 2026-10-29, 3 departures, zero writes. Do not broaden this worker token's D1 scope.
      - name: Check account and existing Worker bindings without writes
        working-directory: ${{ runner.temp }}/santa-source
        run: |
          set -euo pipefail
          node scripts/cloudflare-token-preflight.mjs
      - name: Deploy exact commit, preserving all secrets and bindings
        working-directory: ${{ runner.temp }}/santa-source
        run: |
          set -euo pipefail
          npx wrangler deploy --config dist/server/wrangler.json --keep-vars --strict --message "git:$TARGET_SHA"
      - name: Verify 100% production traffic and safe smoke
        working-directory: ${{ runner.temp }}/santa-source
        env:
          EXPECTED_SHA: 591ddd04dc8a8556969957d263a71d0d435fb836
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs > "$RUNNER_TEMP/release-evidence.json"
          curl -fLsS --max-time 20 -o /dev/null https://excursoessantarita.com.br/
          curl -fLsS --max-time 20 -o /dev/null https://excursoessantarita.com.br/excursoes
          curl -fLsS --max-time 20 "https://excursoessantarita.com.br/admin/admin.js?release=$TARGET_SHA" -o "$RUNNER_TEMP/admin.js"
          grep -Fq 'departure-card__status' "$RUNNER_TEMP/admin.js"
          grep -Fq 'sales-activation-dialog' "$RUNNER_TEMP/admin.js"
          status=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' https://excursoessantarita.com.br/api/admin/session)
          test "$status" = 401
      - name: Retain sanitized release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: santa-rita-pinned-release
          path: ${{ runner.temp }}/release-evidence.json
          if-no-files-found: ignore
          retention-days: 7
