name: Punctum R2 source byte SHA audit (read only)

on:
  push:
    branches: [agent/hostinger-node-migration-20261112]
    paths:
      - '.github/workflows/punctum-r2-byte-audit.yml'
      - 'scripts/punctum-r2-byte-audit.mjs'
      - 'scripts/punctum-r2-byte-audit.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: punctum-r2-source-byte-sha-readonly
  cancel-in-progress: false

jobs:
  sha256:
    if: github.repository == 'menezesx2k26-byte/lab-punctum-picture'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test scripts/punctum-r2-byte-audit.test.mjs
      - name: Hash original object bytes in runner memory only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/punctum-r2-byte-audit.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: punctum-r2-byte-audit-only-summary
          path: outputs/punctum-r2-byte-audit/report.json
          if-no-files-found: warn
          retention-days: 14
