name: Punctum Hostinger — private R2 import preflight

on:
  push:
    branches: [agent/punctum-r2-encrypted-stage-20261113]
    paths:
      - "scripts/punctum-r2-import-private-stage.mjs"
      - "scripts/punctum-r2-import-private-stage.test.mjs"
      - "scripts/punctum-r2-extract-verified.py"
      - "scripts/punctum-r2-extract-verified.test.py"
      - "scripts/punctum-r2-encrypted-stage.mjs"
      - "scripts/punctum-r2-encrypted-stage.test.mjs"
      - ".github/workflows/punctum-r2-import-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test scripts/punctum-r2-encrypted-stage.test.mjs scripts/punctum-r2-import-private-stage.test.mjs
      - run: node --test services/punctum-hostinger-production/originals.test.mjs
      - run: python3 scripts/punctum-r2-extract-verified.test.py
