name: R4 rollback existing QA read-only preflight

on:
  push:
    branches: ["fix/punctum-albums-r4-completion-20261107"]
    paths:
      - ".github/workflows/r4-rollback-readonly.yml"
      - "scripts/r4-rollback-preflight-readonly.mjs"
      - "scripts/lib/r4-rollback-readonly.mjs"
      - "scripts/r4-rollback-readonly.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r4-rollback-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify conservative G23 readback policy
        run: node --test scripts/r4-rollback-readonly.test.mjs
      - name: Inventory only — no remote writes, rollback or deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/r4-rollback-preflight-readonly.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: r4-rollback-readonly-evidence
          path: outputs/r4-rollback-readonly.json
          if-no-files-found: warn
          retention-days: 14
