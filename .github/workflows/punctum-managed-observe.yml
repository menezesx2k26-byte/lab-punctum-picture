name: Punctum managed origin read-only diagnostics
on:
  push:
    branches: [codex/punctum-managed-production-20261114]
    paths: [.github/workflows/punctum-managed-observe.yml]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read only the designated managed origin
        env:
          HOSTINGER_API: ${{ secrets.HOSTINGER_API }}
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          sys.path.insert(0, 'scripts')
          from hostinger_managed_qa import Recovery, SITE
          op = Recovery(pathlib.Path.cwd(), 'prepare', '01a1dada-a528-7083-9569-57509699ffc4')
          settings = op.api('settings', SITE + '/builds/settings')
          environment = op.api('environment', SITE + '/builds/settings/env')
          history = op.api('history', SITE + '/builds')
          proof = {'readOnly': True, 'settings': settings,
                   'environmentKeys': sorted(row['key'] for row in environment), 'builds': []}
          def strings(value):
              if isinstance(value, str): yield value
              elif isinstance(value, dict):
                  for child in value.values(): yield from strings(child)
              elif isinstance(value, list):
                  for child in value: yield from strings(child)
          def summarize(value):
              text = '\n'.join(strings(value))
              codes = sorted(set(re.findall(r'\b(?:CANDIDATE_[A-Z0-9_]+|MANAGED_IMPORT_[A-Z0-9_]+|PUNCTUM_MANAGED_IMPORT_FAILED|ERR_[A-Z0-9_]+|EACCES|ENOENT|EADDRINUSE)\b', text)))
              receipts = []
              for line in text.splitlines():
                  prefix = 'PUNCTUM_MANAGED_IMPORT '
                  if prefix not in line: continue
                  try: item = json.JSONDecoder().raw_decode(line.split(prefix, 1)[1])[0]
                  except (ValueError, TypeError): continue
                  receipts.append({k: item.get(k) for k in ('objects','bytes','integrity','missingReady','cipherSha256','reused')})
              return {'codes': codes, 'importReceipts': receipts,
                      'archiveMentions': 'archive' in text.lower(), 'unzipMentions': 'unzip' in text.lower(),
                      'outOfMemory': any(x in text.lower() for x in ('out of memory','heap limit','sigkill'))}
          for row in history[:2]:
              detail = op.api('build-' + row['uuid'], SITE + '/builds/' + row['uuid'])
              logs = op.api('logs-' + row['uuid'], SITE + '/builds/' + row['uuid'] + '/logs')
              proof['builds'].append({'uuid': row['uuid'], 'state': row.get('state'), 'diagnostics': summarize(logs),
                                      'settings': {k: detail.get('options',{}).get(k) for k in ('build_script','entry_file')}})
          proof['settings'] = {k: settings.get(k) for k in ('app_type','node_version','package_manager','build_script','entry_file')}
          proof['runtime'] = summarize(op.api('runtime', SITE + '/runtime-logs?period=1h&limit=200'))
          output = pathlib.Path('outputs/punctum-managed-observe')
          output.mkdir(parents=True, exist_ok=True)
          (output/'report.json').write_text(json.dumps(proof, indent=2))
          print(json.dumps(proof, indent=2))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: punctum-managed-observe
          path: outputs/punctum-managed-observe/
          retention-days: 7
