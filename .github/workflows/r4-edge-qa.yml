name: R4 fresh edge QA
on:
  push:
    branches: ["agent/hst-001-hostinger-qa-20261028"]
    paths: [".github/workflows/r4-edge-qa.yml", "scripts/r4-edge-qa.mjs", "scripts/lib/r4-edge-qa.mjs", "scripts/r4-edge-execute.mjs"]
permissions:
  contents: read
concurrency:
  group: punctum-r4-fresh-edge-qa
  cancel-in-progress: false
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[r4-qa-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --test scripts/r4-edge-qa.test.mjs
      - run: npm ci
      - name: Build fixed baseline and current candidate without deploying production
        run: |
          mkdir .qa-baseline
          git fetch origin b417405c0406daf286b192a8151cf45c4a50f89c
          git archive b417405c0406daf286b192a8151cf45c4a50f89c | tar -x -C .qa-baseline
          ln -s ../node_modules .qa-baseline/node_modules
          npm --prefix .qa-baseline run build
          npm run build
      - name: Read account quotas before any isolated resource mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN2 }}
          R4_EDGE_QA_EXECUTE: "true"
          R4_EDGE_QA_RESUME: "true"
          R4_EDGE_QA_RECOVERY: "true"
        run: node scripts/r4-edge-qa.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: r4-edge-qa-report
          path: outputs/r4-edge-qa-report.json
          retention-days: 14
