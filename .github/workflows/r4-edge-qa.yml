name: R4 fresh edge QA
on:
  push:
    branches: ["agent/hst-001-hostinger-qa-20261028"]
    paths: [".github/workflows/r4-edge-qa.yml", "scripts/r4-edge-qa.mjs", "scripts/lib/r4-edge-qa.mjs"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --test scripts/r4-edge-qa.test.mjs
      - name: Read account quotas before any isolated resource mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN2 }}
        run: node scripts/r4-edge-qa.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: r4-edge-qa-report
          path: outputs/r4-edge-qa-report.json
          retention-days: 14
