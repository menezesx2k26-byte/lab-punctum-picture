name: Punctum D1 R2 private metadata parity (read only)

on:
  push:
    branches: [agent/hostinger-node-migration-20261112]
    paths:
      - '.github/workflows/punctum-r2-readonly-audit.yml'
      - 'scripts/punctum-r2-readonly-audit.mjs'
      - 'scripts/punctum-r2-readonly-audit.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: punctum-d1-r2-readonly-audit
  cancel-in-progress: false

jobs:
  inventory:
    if: github.repository == 'menezesx2k26-byte/lab-punctum-picture'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test fail-closed parity and privacy contract
        run: node --test scripts/punctum-r2-readonly-audit.test.mjs
      - name: Compare production D1 references with R2 metadata (no source writes)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/punctum-r2-readonly-audit.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: punctum-d1-r2-metadata-parity
          path: outputs/punctum-r2-readonly-audit/report.json
          if-no-files-found: warn
          retention-days: 14
