name: Punctum Unlimited Cloudflare D1/R2 Sync

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: punctum-unlimited-d1-r2-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'menezesx2k26-byte/lab-punctum-picture' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm install --global --no-audit --no-fund wrangler@4.125.0

      - name: Export read-only sealed snapshot from Cloudflare D1 and R2
        env:
          CLOUDFLARE_ACCOUNT_ID: '257bca437616da74ece1ce4bbaf0bd89'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          SOURCE_ADMIN_EMAIL: ${{ secrets.SOURCE_ADMIN_EMAIL }}
          PUNCTUM_MANAGED_OUTPUT: ${{ runner.temp }}/punctum-managed-sealed
        run: node scripts/hostinger-managed-export.mjs

      - name: Sync sealed snapshot to Hostinger Unlimited (u775492464)
        env:
          HOSTINGER_UNLIMITED_API: ${{ secrets.HOSTINGER_UNLIMITED_API }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.PUNCTUM_CLERK_PRODUCTION_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.PUNCTUM_CLERK_PRODUCTION_SECRET_KEY }}
          PUNCTUM_CLERK_ADMIN_USER_ID: ${{ secrets.PUNCTUM_CLERK_ADMIN_USER_ID }}
          PUNCTUM_MANAGED_OUTPUT: ${{ runner.temp }}/punctum-managed-sealed
        run: python3 scripts/hostinger_unlimited_d1_r2_sync.py

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: punctum-unlimited-d1-r2-sync-summary
          path: outputs/unlimited-d1-r2-sync/
          if-no-files-found: warn
          retention-days: 14
