name: Punctum reverse recovery preflight
on:
  push:
    branches: [codex/punctum-managed-production-20261114]
    paths: [.github/workflows/punctum-recovery-preflight.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Inspect existing recovery databases and prove private backup transport
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, secrets, urllib.parse, urllib.request, uuid
          base='https://api.cloudflare.com/client/v4/accounts/257bca437616da74ece1ce4bbaf0bd89'
          report={'productionMutations':0,'databases':{},'privateTransport':{}}
          def call(path,token='D1_TOKEN',method='GET',payload=None,raw=False):
              body=payload if isinstance(payload,bytes) else None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(base+path,data=body,method=method,headers={
                  'Authorization':'Bearer '+os.environ[token],
                  'Content-Type':'application/octet-stream' if isinstance(payload,bytes) else 'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  data=response.read(12000000)
                  if raw: return data
                  value=json.loads(data); assert value.get('success') is True
                  return value['result']
          for db in ('0141b8f9-3074-4aa4-a184-92a4f7379ecc','2e7710f3-dc92-4aeb-976a-5f15d8c5262c'):
              path='/d1/database/'+db+'/query'
              schema=call(path,method='POST',payload={'sql':"SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' ORDER BY name"})[0]['results']
              tables={}
              for row in schema:
                  name=row['name']; escaped='"'+name.replace('"','""')+'"'
                  rows=call(path,method='POST',payload={'sql':'SELECT * FROM '+escaped})[0]['results']
                  documents=sorted(json.dumps(x,sort_keys=True,separators=(',',':'),ensure_ascii=False) for x in rows)
                  tables[name]={'rows':len(rows),'sha256':hashlib.sha256('\n'.join(documents).encode()).hexdigest()}
              report['databases'][db]={'readOnly':True,'tables':tables,'occupied':any(x['rows'] for x in tables.values())}
          key='managed-recovery/canary-'+uuid.uuid4().hex
          path='/r2/buckets/punctum-picture-backups/objects/'+urllib.parse.quote(key,safe='')
          body=secrets.token_bytes(32)
          try:
              call(path,'CF_TOKEN','PUT',body)
              actual=call(path,'CF_TOKEN',raw=True)
              assert actual==body
              report['privateTransport']={'putGetVerified':True,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()}
          finally:
              call(path,'CF_TOKEN','DELETE')
              report['privateTransport']['ownCanaryDeleted']=True
          output=pathlib.Path('recovery-preflight'); output.mkdir()
          (output/'report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: punctum-reverse-recovery-preflight
          path: recovery-preflight/
          retention-days: 7
