name: Temporary Santa Rita public read-only smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify public assets, routes and authentication boundary without writing
        shell: bash
        run: |
          set -euo pipefail
          SHA=591ddd04dc8a8556969957d263a71d0d435fb836
          BASE=https://excursoessantarita.com.br
          ready=false
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -L --max-time 20 -w '%{http_code}' -o /tmp/santa-admin.js "$BASE/admin/admin.js?release=$SHA&attempt=$attempt" || echo ERR)
            bytes=$(wc -c </tmp/santa-admin.js 2>/dev/null || echo 0)
            if [ "$code" = 200 ] && grep -Fq 'sales-activation-dialog' /tmp/santa-admin.js && grep -Fq 'departure-card__status' /tmp/santa-admin.js; then
              ready=true
              echo "admin_js=PASS http=200 bytes=$bytes attempt=$attempt"
              break
            fi
            echo "admin_js=PENDING http=$code bytes=$bytes attempt=$attempt"
            sleep 4
          done
          test "$ready" = true || { echo 'FAIL: public admin JS not the reviewed version'; exit 1; }
          for path in / /excursoes /admin/; do
            code=$(curl -sS -L --max-time 20 -w '%{http_code}' -o /dev/null "$BASE$path" || echo ERR)
            echo "route=$path http=$code"
            test "$code" = 200
          done
          code=$(curl -sS --max-time 20 -w '%{http_code}' -o /dev/null "$BASE/api/admin/session" || echo ERR)
          echo "anonymous_admin_http=$code"
          test "$code" = 401
          echo "READ_ONLY_SANTA_RITA_PUBLIC_SMOKE=PASS"
