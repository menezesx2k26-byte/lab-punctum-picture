name: Punctum Hostinger — real snapshot staging (private only)

on:
  push:
    branches: [agent/punctum-hostinger-real-stage-20261113]
    paths:
      - "services/punctum-hostinger-production/**"
      - "package.json"
      - ".github/workflows/punctum-hostinger-real-stage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: punctum-hostinger-real-stage-ci
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'menezesx2k26-byte/lab-punctum-picture'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prove production snapshot origin and D1 write gates
        run: node --test services/punctum-hostinger-production/staging.test.mjs services/punctum-hostinger-production/originals.test.mjs
      - name: Verify fail-closed Vinext client-abort handling without mutating dependency
        run: node --test scripts/hostinger-vinext-client-abort-patch.test.mjs
      - name: Build production staging app separately from QA
        run: npm run build:hostinger:real-stage
      - name: Typecheck
        run: npm run typecheck
      - name: Publish only build metadata
        if: success()
        run: |
          echo "PRIVATE_STAGING_BUILD_VERIFIED sha=$GITHUB_SHA"
