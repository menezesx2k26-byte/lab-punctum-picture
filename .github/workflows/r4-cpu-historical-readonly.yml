name: R4 historical QA CPU telemetry read-only
on:
  push:
    branches: ["fix/punctum-albums-r4-completion-20261107"]
    paths:
      - ".github/workflows/r4-cpu-historical-readonly.yml"
      - "scripts/r4-cpu-historical-readonly.mjs"
      - "scripts/lib/r4-cpu-historical-readonly.mjs"
      - "scripts/r4-cpu-historical-readonly.test.mjs"
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --test scripts/r4-cpu-historical-readonly.test.mjs
      - name: Query historical QA CPU without writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/r4-cpu-historical-readonly.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: r4-cpu-historical-readonly
          path: outputs/r4-cpu-historical-readonly.json
          if-no-files-found: warn
          retention-days: 14
