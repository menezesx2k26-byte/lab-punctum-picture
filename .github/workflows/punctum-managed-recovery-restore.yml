name: Punctum restore the already exported managed recovery snapshot
on:
  push:
    branches: [codex/punctum-managed-production-20261114]
    paths:
      - .github/workflows/punctum-managed-recovery-restore.yml
      - scripts/hostinger-managed-recovery-download.mjs
permissions:
  contents: read
  actions: read
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Reuse the acknowledged encrypted export without another hosting mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43678214437 --repo menezesx2k26-byte/lab-punctum-picture --name punctum-encrypted-managed-recovery --dir outputs/punctum-managed-production
          python3 - <<'PY'
          import json,os,pathlib,re
          report=json.loads(pathlib.Path('outputs/punctum-managed-production/report.json').read_text())
          assert report['sourceSha']=='55ccb970875b9b14fbfa52a205c67195152944b9'
          assert report['status']=='MANAGED_RECOVERY_EXPORTED_SECRETS_REMOVED'
          prefix=report['recoveryExport']['prefix']; assert re.fullmatch('managed-recovery/snapshot-[a-f0-9]{32}',prefix)
          with open(os.environ['GITHUB_ENV'],'a') as output: print('PUNCTUM_MANAGED_RECOVERY_PREFIX='+prefix,file=output)
          PY
      - name: Prove independent decryption, D1 import and complete row and original hashes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUNCTUM_MANAGED_RECOVERY_KEY: ${{ secrets.PUNCTUM_MANAGED_RECOVERY_KEY }}
        run: node scripts/hostinger-managed-recovery-download.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: punctum-managed-recovery-restore
          path: outputs/punctum-managed-production/
          retention-days: 7
