name: R4 Images ephemeral synthetic binding QA

on:
  push:
    branches: ["fix/punctum-albums-r4-completion-20261107"]
    paths:
      - ".github/workflows/r4-images-ephemeral-qa.yml"
      - "scripts/r4-images-ephemeral-qa.mjs"
      - "scripts/r4-images-probe-worker.mjs"
      - "scripts/r4-images-probe-worker.test.mjs"
      - "scripts/lib/r4-images-preflight.mjs"
      - "scripts/r4-images-preflight.test.mjs"

permissions:
  contents: read

concurrency:
  group: r4-images-synthetic-binding-probe
  cancel-in-progress: false

jobs:
  synthetic-probe:
    if: contains(github.event.head_commit.message, '[r4-image-binding-qa]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: node --test scripts/r4-images-preflight.test.mjs scripts/r4-images-probe-worker.test.mjs
      - run: npm ci
      - name: One synthetic Images transformation in isolated free Worker, then delete
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN2 }}
          R4_IMAGES_EPHEMERAL_QA: "true"
        run: node scripts/r4-images-ephemeral-qa.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: r4-images-ephemeral-qa-report
          path: outputs/r4-images-ephemeral-qa.json
          if-no-files-found: warn
          retention-days: 7