name: Punctum Hostinger account preflight (read-only)

# Fixed account profiles; ownership POST is diagnostic only, without DNS writes.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Fixed authorized hosting account
        type: choice
        options: [unlimited, premium]
        default: unlimited
  push:
    branches: [cursor/r4-aj-security-phase-b-ae72, codex/punctum-unlimited-release-20261120]
    paths:
      - .github/workflows/punctum-hostinger-account-preflight.yml
      - scripts/punctum-hostinger-account-preflight.py

permissions:
  contents: read

concurrency:
  group: punctum-hostinger-account-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'menezesx2k26-byte/lab-punctum-picture'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Hostinger RO account + Node API probe
        shell: bash
        env:
          HOSTINGER_API: ${{ inputs.target == 'premium' && secrets.HOSTINGER_API || '' }}
          HOSTINGER_UNLIMITED_API: ${{ inputs.target != 'premium' && secrets.HOSTINGER_UNLIMITED_API || '' }}
        run: |
          set +x
          mkdir -p outputs/hostinger-account-preflight
          python3 scripts/punctum-hostinger-account-preflight.py --target "${{ inputs.target || 'unlimited' }}" --check-domain | tee outputs/hostinger-account-preflight/report.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: punctum-hostinger-account-preflight
          path: outputs/hostinger-account-preflight/
          retention-days: 14
