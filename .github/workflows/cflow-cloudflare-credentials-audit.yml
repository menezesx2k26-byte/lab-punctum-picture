name: CurriculoFlow Cloudflare credentials compatibility check (read-only)

on:
  push:
    branches:
      - agent/cflow-cloudflare-credential-audit-20261121
    paths:
      - .github/workflows/cflow-cloudflare-credentials-audit.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_TOKEN2: ${{ secrets.CLOUDFLARE_API_TOKEN2 }}
      CLOUDFLARE_API_TOKEN3: ${{ secrets.CLOUDFLARE_API_TOKEN3 }}
      CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - name: Verify existing Cloudflare token compatibility (HTTP GET only)
        shell: bash
        run: |
          set -euo pipefail
          target_account=0f57737ceb7f72ed2f7d3408b0b0f228
          target_zone=ff15e7b632351e496eefc20979235bb0
          usable=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_API_TOKEN2 CLOUDFLARE_API_TOKEN3 CLOUDFLARE_DNS_API_TOKEN CLOUDFLARE_D1_API_TOKEN; do
            token="${!key:-}"
            if [[ -z "$token" ]]; then echo "$key: ABSENT"; continue; fi
            verify=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" 'https://api.cloudflare.com/client/v4/user/tokens/verify')
            workers=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4/accounts/$target_account/workers/scripts")
            zone=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4/zones/$target_zone")
            echo "$key: validity=$verify dedicated_workers=$workers dedicated_zone=$zone"
            if [[ "$verify" == 200 && "$workers" == 200 ]]; then
              echo "$key: PASS for dedicated CurriculoFlow Workers account (read only)"
              usable=1
            fi
          done
          if [[ "$usable" != 1 ]]; then
            echo '::warning::No available pre-existing token has proven dedicated CurriculoFlow Workers read access.'
            exit 1
          fi
          echo 'No secrets, DNS or Workers were changed.'
